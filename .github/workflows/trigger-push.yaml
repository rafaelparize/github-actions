name: Criando nosso trigger de push

on:
  push:
    branches:
      - 'main'
      - 'staging'
    paths:
      - '**.tf'


jobs:
  job-push:
    runs-on: ubuntu-latest
    steps:
      - name: Print mensagem de push
        run: echo "Um push em seus arquivos Terraform foi feito em uma branch principal"