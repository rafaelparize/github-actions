name: Criando nosso trigger de pull request

on:
  pull_request:
    types: [opened, edited, closed, reopened]
    branches:
      - 'main'
      - 'main*'
      - 'main/**'


jobs:
  job-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Print mensagem de pull request
        run: echo "Um pull requeste foi aberto/editado/fechado/reaberto com destino a branch main"