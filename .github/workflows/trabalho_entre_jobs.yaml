name: Vendo arquivos compartilhados entre jobs

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release
      
      - name: Envia ip do runner para arquivo
        run: ip a > ${{ github.workspace }}/ip.txt

      - uses: actions/upload-artifact@v4
        with:
          name: file-upload
          path: ${{ github.workspace }}/ip.txt

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Ver o conteudo do diretorio
        run: ls -lha

      - uses: actions/download-artifact@v4
        with:
          name: file-upload
          path: config

      - name: Ver o conteudo do diretorio
        run: ls -lha && ls ./config/

      - name: Acessa arquivo de ip
        run: mv config/ip.txt . && rm -rf ./config 

      - name: Ver o conteudo do diretorio
        run: ls -lha

      - name: Acessa arquivo ip
        run: cat ip.txt