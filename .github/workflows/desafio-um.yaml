name: Desafio workflow com input

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: 'Nome da imagem'
        required: true
        type: string

jobs:
  pull_scan:
    runs-on: ubuntu-26.04
    if: ${{ inputs.imagem != '' }}
    steps:
      - name: Pull a imagem
        run: docker image pull ${{ inputs.imagem }}

      - name: Lista as imagens
        run: docker image ls

      - name: Login no docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan de vunerabilidades com docker scout
        uses: docker/scout-action@v1.26.0
        with:
          command: cves
          image: ${{ inputs.imagem }}
