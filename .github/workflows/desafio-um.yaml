name: Desafio workflow com input

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: 'Nome da imagem'
        required: true
        type: string

jobs:
  pull:
    runs-on: ubuntu-latest
    if: ${{ inputs.imagem != '' }}
    steps:
      - name: Pull a imagem
        run: docker image pull ${{ inputs.imagem }}
